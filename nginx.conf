events {}

http {
    limit_req_zone $binary_remote_addr zone=forum_threads:10m rate=90r/m;

    upstream forum_api {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name dcdg.xyz www.dcdg.xyz;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name dcdg.xyz www.dcdg.xyz;

        ssl_certificate /etc/letsencrypt/live/dcdg.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dcdg.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /threads {
            limit_req zone=forum_threads;
            proxy_pass http://forum_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://forum_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
